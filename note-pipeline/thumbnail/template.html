<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:670px;background:#FEFCF8;overflow:hidden;position:relative;font-family:'Zen Kaku Gothic New',sans-serif;color:#2b2523}
.blob{position:absolute;right:40px;top:40px;width:560px;height:560px;border-radius:50%;background:{{BLOB}}}
.char{position:absolute;right:70px;bottom:-6px;height:660px}
.txt{position:absolute;left:84px;top:96px;width:720px}
.tag{display:inline-block;font-weight:700;font-size:22px;letter-spacing:.08em;color:#fff;background:{{ACCENT}};border-radius:999px;padding:8px 22px}
h1{font-family:'Zen Maru Gothic',sans-serif;font-weight:900;font-size:{{TITLE_SIZE}}px;line-height:1.3;white-space:nowrap;margin-top:34px;letter-spacing:.01em}
h1 em{font-style:normal;color:{{ACCENT_DARK}}}
h1 u{text-decoration:none;background:linear-gradient(transparent 68%,{{BLOB}} 68%)}
.sub{font-weight:700;font-size:28px;line-height:1.6;margin-top:30px;color:#4a403d}
.sub b{color:{{ACCENT_DARK}}}
.foot{position:absolute;left:84px;bottom:52px;font-size:20px;font-weight:700;letter-spacing:.12em;color:#9a8c87}
svg.path{position:absolute;left:430px;top:58px;overflow:visible}
</style></head><body>
<div class="blob"></div>
<svg class="path" width="320" height="120" viewBox="0 0 320 120">
 <path d="M10 100 C 90 100, 160 60, 260 52" fill="none" stroke="{{ACCENT}}" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/>
 <g transform="translate(278 48) rotate(-8)" fill="{{ACCENT}}">
  <path d="M-22 0 L18 -3 Q28 0 18 3 Z"/><path d="M-2 -1 L-12 -18 L-6 -18 L8 -1 Z"/><path d="M-2 1 L-12 18 L-6 18 L8 1 Z"/><path d="M-20 -1 L-26 -9 L-22 -9 L-14 -1 Z"/><path d="M-20 1 L-26 9 L-22 9 L-14 1 Z"/>
 </g>
</svg>
<img class="char" src="{{CHAR_SRC}}">
<div class="txt">
 <span class="tag">{{TAG}}</span>
 <h1>{{TITLE_HTML}}</h1>
 <p class="sub">{{SUB_HTML}}</p>
</div>
<div class="foot">SENA ｜ 外資 × メンタル × AI</div>
</body></html>
