name: Make and upload episodes

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode number(s), e.g. 1 or 1,2. Use next for the next unpublished ones."
        default: "next"
      action:
        description: "make = build only; upload = build and upload; reschedule = give uploaded private episodes publish times (in the order listed); publish = make uploaded episodes public now; captions = add Japanese captions to uploaded episodes; organize = update titles and descriptions and add to the playlist in order; thumbnail = replace thumbnails of uploaded episodes; short_make = build the vertical Shorts only; short = build and upload Shorts (episode: number(s), or next; see short_kind); stats = views and likes of every Short, by kind; report = channel numbers for the weekly report (saved to reports/); trailer = make the Start here trailer (download it from Artifacts or the trailer-preview branch); trailer_upload = upload the finished trailer in episodes/trailer/final as private"
        type: choice
        options: [make, upload, reschedule, publish, captions, organize, thumbnail, short_make, short, stats, report, trailer, trailer_upload, channel]
        default: make
      short_kind:
        description: "For short / short_make: which Short (ai = Why can't AI do this?, highlight = the most striking moment, story = Daniel's story, culture = Japan vs the US, lab = Speaking Lab), or all"
        type: choice
        options: [all, ai, highlight, story, culture, lab]
        default: all
      visibility:
        description: "For upload / short: schedule (next free slot: episodes 00:00 / 12:00 JST, Shorts 08:00 / 18:00 / 22:00 JST), public, or private"
        type: choice
        options: [schedule, public, private]
        default: schedule
  schedule:
    # Twice a day at 21:00 and 09:00 Japan time (12:00 and 00:00 UTC), about 3 hours before a slot.
    # Episodes go public one at a time, in order, at 00:00 / 12:00 JST (see src/slot.py).
    # A run uploads the next episode only when its slot is the coming one, otherwise it waits.
    # Runs only when the repository variable AUTO_UPLOAD is "true".
    # The same runs also queue Shorts, one per slot (08:00 / 18:00 / 22:00 JST, see src/shorts.py);
    # set the repository variable AUTO_SHORTS to "false" to stop that.
    - cron: "0 0,12 * * *"

permissions:
  contents: write

concurrency:
  group: episodes
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CLIENT_ID: ${{ secrets.CLIENT_ID }}
  CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
  REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}

jobs:
  episodes:
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_UPLOAD == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          # Episode scripts, code and published.json live on the episodes branch.
          ref: episodes

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -r requirements.txt

      - name: Sync published.json with YouTube
        # Records uploads that a previous run could not save (cheap: a few quota units).
        run: python src/upload.py sync || echo "sync skipped"

      - name: Choose episodes
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          EPISODE: ${{ inputs.episode }}
          ACTION: ${{ inputs.action }}
          VISIBILITY: ${{ inputs.visibility }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            when=$(python src/slot.py)
            echo "Publish slot: $when" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$when" = "wait" ]; then list=""; else list=$(python src/pick.py next 1); fi
            action=upload
          else
            list=$(python src/pick.py "$EPISODE")
            action=$ACTION
            case "$VISIBILITY" in
              schedule) when=$(python src/slot.py --force) ;;
              public) when=now ;;
              *) when="" ;;
            esac
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "publish_at=$when" >> "$GITHUB_OUTPUT"
          echo "visibility=${VISIBILITY:-schedule}" >> "$GITHUB_OUTPUT"

      - name: Give uploaded episodes publish times
        if: steps.pick.outputs.action == 'reschedule' && steps.pick.outputs.list != ''
        run: python src/upload.py reschedule ${{ steps.pick.outputs.list }} | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Make uploaded episodes public now
        if: steps.pick.outputs.action == 'publish' && steps.pick.outputs.list != ''
        run: python src/upload.py publish ${{ steps.pick.outputs.list }} | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Add captions (Japanese and English) to uploaded episodes
        if: steps.pick.outputs.action == 'captions' && steps.pick.outputs.list != ''
        env:
          SENA_VOICE: ${{ vars.SENA_VOICE }}
          DANIEL_VOICE: ${{ vars.DANIEL_VOICE }}
        run: |
          for n in ${{ steps.pick.outputs.list }}; do
            python src/make_episode.py "$n" --audio-only
          done
          python src/upload.py captions ${{ steps.pick.outputs.list }} | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Update titles and playlist
        if: steps.pick.outputs.action == 'organize' && steps.pick.outputs.list != ''
        run: python src/upload.py organize ${{ steps.pick.outputs.list }} | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Replace thumbnails
        if: steps.pick.outputs.action == 'thumbnail' && steps.pick.outputs.list != ''
        run: |
          python src/make_thumbnail.py ${{ steps.pick.outputs.list }}
          python src/upload.py thumb ${{ steps.pick.outputs.list }}

      - name: Make videos
        if: (steps.pick.outputs.action == 'make' || steps.pick.outputs.action == 'upload') && steps.pick.outputs.list != ''
        env:
          SENA_VOICE: ${{ vars.SENA_VOICE }}
          DANIEL_VOICE: ${{ vars.DANIEL_VOICE }}
        run: |
          python src/fetch_icons.py ${{ steps.pick.outputs.list }} || echo "illustrations skipped"
          for n in ${{ steps.pick.outputs.list }}; do
            python src/make_episode.py "$n"
          done

      - name: Save videos for download
        if: (steps.pick.outputs.action == 'make' || steps.pick.outputs.action == 'upload') && steps.pick.outputs.list != ''
        uses: actions/upload-artifact@v4
        with:
          name: episodes-${{ github.run_number }}
          path: |
            output/*/*.mp4
            output/*/*.jpg
            output/*/*.srt
            output/*/*.txt
          retention-days: 30

      - name: Upload to YouTube
        if: steps.pick.outputs.action == 'upload' && steps.pick.outputs.list != ''
        env:
          PUBLISH_AT: ${{ steps.pick.outputs.publish_at }}
          VISIBILITY: ${{ steps.pick.outputs.visibility }}
          EVENT: ${{ github.event_name }}
        run: |
          first=1
          for n in ${{ steps.pick.outputs.list }}; do
            # Manual runs with several episodes: each scheduled episode takes the next free slot.
            if [ "$EVENT" != "schedule" ] && [ "$VISIBILITY" = "schedule" ] && [ "$first" = 0 ]; then
              PUBLISH_AT=$(python src/slot.py --force)
            fi
            first=0
            export PUBLISH_AT
            vid=$(python src/upload.py "$n" | tail -n 1)
            echo "EP $n -> https://youtu.be/$vid (publish: ${PUBLISH_AT:-private})" | tee -a "$GITHUB_STEP_SUMMARY"
            python src/mark_published.py "$n" "$vid" "$PUBLISH_AT"
          done

      - name: Make the Start here trailer
        if: inputs.action == 'trailer'
        env:
          SENA_VOICE: ${{ vars.SENA_VOICE }}
          DANIEL_VOICE: ${{ vars.DANIEL_VOICE }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          set +e
          python src/make_trailer.py | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          set -e
          # keep a copy of the video on the trailer-preview branch, so it can be watched without unzipping
          if [ -f output/trailer/trailer.mp4 ]; then
            rm -rf /tmp/preview && mkdir /tmp/preview && cp output/trailer/trailer.mp4 output/trailer/*.srt /tmp/preview/
            cd /tmp/preview && git init -q && git checkout -q -b trailer-preview && git add .
            git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "Trailer preview"
            git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" trailer-preview || echo "preview not pushed"
          fi
          [ "$code" = 75 ] && echo "YouTube's daily upload limit is reached; run the trailer action again later" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Upload the finished Start here trailer (private)
        if: inputs.action == 'trailer_upload'
        run: python src/upload_trailer.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save the trailer for download
        if: "!cancelled() && inputs.action == 'trailer'"
        uses: actions/upload-artifact@v4
        with:
          name: trailer-${{ github.run_number }}
          path: output/trailer/
          retention-days: 30

      # ---------- Shorts ----------

      - name: Choose Shorts
        id: short
        if: >-
          !cancelled() &&
          ((github.event_name == 'schedule' && vars.AUTO_SHORTS != 'false') ||
           (github.event_name == 'workflow_dispatch' && (inputs.action == 'short' || inputs.action == 'short_make')))
        env:
          EVENT: ${{ github.event_name }}
          EPISODE: ${{ inputs.episode }}
          ACTION: ${{ inputs.action }}
          KIND: ${{ inputs.short_kind }}
          VISIBILITY: ${{ inputs.visibility }}
          SHORT_SLOTS_JST: ${{ vars.SHORT_SLOTS_JST }}
        run: |
          python src/upload.py short-comments || echo "link comments skipped"
          mkdir -p output
          if [ "$EVENT" = "schedule" ]; then
            python src/shorts.py plan > output/short_plan.txt
            action=short
          else
            vis=$VISIBILITY
            [ "$ACTION" = "short_make" ] && vis=private
            python src/shorts.py manual "$EPISODE" "${KIND:-all}" "$vis" > output/short_plan.txt
            action=$ACTION
          fi
          echo "Shorts (episode, kind, publish time UTC):" >> "$GITHUB_STEP_SUMMARY"
          cat output/short_plan.txt | tee -a "$GITHUB_STEP_SUMMARY"
          [ -s output/short_plan.txt ] && echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "action=$action" >> "$GITHUB_OUTPUT"

      - name: Make Shorts
        if: "!cancelled() && steps.short.outputs.ready == 'true'"
        env:
          SENA_VOICE: ${{ vars.SENA_VOICE }}
          DANIEL_VOICE: ${{ vars.DANIEL_VOICE }}
        run: |
          while read -r n kind when; do
            python src/make_short.py "$n" --kind "$kind" < /dev/null || echo "::warning::Short EP $n $kind could not be made"
          done < output/short_plan.txt

      - name: Save Shorts for download
        if: "!cancelled() && steps.short.outputs.ready == 'true'"
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_number }}
          path: output/*/*_short_*.mp4
          retention-days: 30

      - name: Upload Shorts to YouTube
        if: "!cancelled() && steps.short.outputs.ready == 'true' && steps.short.outputs.action == 'short'"
        run: |
          failed=0
          while read -r n kind when; do
            if [ ! -f "output/ep$(printf %02d "$n")/ep$(printf %02d "$n")_short_$kind.json" ]; then
              echo "Short EP $n $kind was not made, skipped" | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            set +e
            out=$(PUBLISH_AT="$when" python src/upload.py short "$n" "$kind" < /dev/null)
            code=$?
            set -e
            if [ $code = 0 ]; then
              echo "Short EP $n $kind -> https://youtube.com/shorts/$(echo "$out" | tail -n 1) (publish: ${when:-private})" | tee -a "$GITHUB_STEP_SUMMARY"
            elif [ $code = 75 ]; then
              echo "YouTube's daily upload limit is reached; the remaining Shorts go up in a later run" | tee -a "$GITHUB_STEP_SUMMARY"
              break
            else
              echo "Short EP $n $kind: upload failed (reason in run_status.json)" | tee -a "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
          done < output/short_plan.txt
          exit $failed

      - name: Short stats
        if: "!cancelled() && (github.event_name == 'schedule' || inputs.action == 'stats')"
        run: python src/upload.py short-stats | tee -a "$GITHUB_STEP_SUMMARY" || echo "stats skipped"

      - name: Channel page and podcast
        if: "!cancelled() && inputs.action == 'channel'"
        run: python src/upload.py channel | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Question comments on episodes that went public
        if: "!cancelled() && github.event_name == 'schedule'"
        run: python src/upload.py episode-comments | tee -a "$GITHUB_STEP_SUMMARY" || echo "question comments skipped"

      - name: Catch up on captions
        # Only in the 09:00 JST run (the second run of YouTube's quota day), up to 4 tracks.
        if: "!cancelled() && github.event_name == 'schedule' && vars.CAPTION_BACKLOG != 'false'"
        env:
          SENA_VOICE: ${{ vars.SENA_VOICE }}
          DANIEL_VOICE: ${{ vars.DANIEL_VOICE }}
          CAPTION_MAX: "4"
        run: |
          if [ "$(date -u +%H)" -ge 6 ]; then echo "captions catch up in the 09:00 JST run"; exit 0; fi
          list=$(python src/upload.py caption-todo 4)
          if [ -z "$list" ]; then echo "all caption tracks are up"; exit 0; fi
          for n in $list; do python src/make_episode.py "$n" --audio-only || true; done
          python src/upload.py captions $list | tee -a "$GITHUB_STEP_SUMMARY" || echo "captions skipped"

      - name: Channel report
        if: "!cancelled() && inputs.action == 'report'"
        run: python src/report.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save published.json
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add published.json
          [ -f playlist.json ] && git add playlist.json
          [ -f run_status.json ] && git add run_status.json
          [ -f shorts.json ] && git add shorts.json
          [ -f shorts_stats.json ] && git add shorts_stats.json
          [ -d reports ] && git add reports
          [ -f captions.json ] && git add captions.json
          [ -f comments.json ] && git add comments.json
          [ -f trailer.json ] && git add trailer.json
          git diff --cached --quiet && exit 0
          git commit -m "Record published episodes"
          for i in 1 2 3; do
            git pull --rebase origin episodes && git push origin HEAD:episodes && exit 0
            sleep 5
          done
          echo "::error::Could not save published.json"
