name: Make and upload episodes

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode number(s), e.g. 1 or 1,2. Use next for the next unpublished ones."
        default: "next"
      action:
        description: "make = build only; upload = build and upload; reschedule = give uploaded private episodes publish times (in the order listed); publish = make uploaded episodes public now; captions = add Japanese captions to uploaded episodes; organize = update titles and descriptions and add to the playlist in order; thumbnail = replace thumbnails of uploaded episodes; short_make = build the vertical Short only; short = build and upload the Short (episode: number(s), or next)"
        type: choice
        options: [make, upload, reschedule, publish, captions, organize, thumbnail, short_make, short]
        default: make
      visibility:
        description: "For upload / short: schedule (next free slot: episodes 00:00 / 12:00 JST, Shorts 08:00 / 18:00 JST), public, or private"
        type: choice
        options: [schedule, public, private]
        default: schedule
  schedule:
    # Twice a day at 21:00 and 09:00 Japan time (12:00 and 00:00 UTC), about 3 hours before a slot.
    # Episodes go public one at a time, in order, at 00:00 / 12:00 JST (see src/slot.py).
    # A run uploads the next episode only when its slot is the coming one, otherwise it waits.
    # Runs only when the repository variable AUTO_UPLOAD is "true".
    # The same runs also queue one Short at a time (08:00 / 18:00 JST, see src/shorts.py);
    # set the repository variable AUTO_SHORTS to "false" to stop that.
    - cron: "0 0,12 * * *"

permissions:
  contents: write

concurrency:
  group: episodes
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CLIENT_ID: ${{ secrets.CLIENT_ID }}
  CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
  REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}

jobs:
  episodes:
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_UPLOAD == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          # Episode scripts, code and published.json live on the episodes branch.
          ref: episodes

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -r requirements.txt

      - name: Sync published.json with YouTube
        # Records uploads that a previous run could not save (cheap: a few quota units).
        run: python src/upload.py sync || echo "sync skipped"

      - name: Choose episodes
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          EPISODE: ${{ inputs.episode }}
          ACTION: ${{ inputs.action }}
          VISIBILITY: ${{ inputs.visibility }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            when=$(python src/slot.py)
            echo "Publish slot: $when" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$when" = "wait" ]; then list=""; else list=$(python src/pick.py next 1); fi
            action=upload
          else
            list=$(python src/pick.py "$EPISODE")
            action=$ACTION
            case "$VISIBILITY" in
              schedule) when=$(python src/slot.py --force) ;;
              public) when=now ;;
              *) when="" ;;
            esac
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "publish_at=$when" >> "$GITHUB_OUTPUT"
          echo "visibility=${VISIBILITY:-schedule}" >> "$GITHUB_OUTPUT"

      - name: Give uploaded episodes publish times
        if: steps.pick.outputs.action == 'reschedule' && steps.pick.outputs.list != ''
        run: python src/upload.py reschedule ${{ steps.pick.outputs.list }} | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Make uploaded episodes public now
        if: steps.pick.outputs.action == 'publish' && steps.pick.outputs.list != ''
        run: python src/upload.py publish ${{ steps.pick.outputs.list }} | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Add Japanese captions to uploaded episodes
        if: steps.pick.outputs.action == 'captions' && steps.pick.outputs.list != ''
        env:
          SENA_VOICE: ${{ vars.SENA_VOICE }}
          DANIEL_VOICE: ${{ vars.DANIEL_VOICE }}
        run: |
          for n in ${{ steps.pick.outputs.list }}; do
            python src/make_episode.py "$n" --audio-only
          done
          python src/upload.py captions ${{ steps.pick.outputs.list }} | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Update titles and playlist
        if: steps.pick.outputs.action == 'organize' && steps.pick.outputs.list != ''
        run: python src/upload.py organize ${{ steps.pick.outputs.list }} | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Replace thumbnails
        if: steps.pick.outputs.action == 'thumbnail' && steps.pick.outputs.list != ''
        run: |
          python src/make_thumbnail.py ${{ steps.pick.outputs.list }}
          python src/upload.py thumb ${{ steps.pick.outputs.list }}

      - name: Make videos
        if: (steps.pick.outputs.action == 'make' || steps.pick.outputs.action == 'upload') && steps.pick.outputs.list != ''
        env:
          SENA_VOICE: ${{ vars.SENA_VOICE }}
          DANIEL_VOICE: ${{ vars.DANIEL_VOICE }}
        run: |
          python src/fetch_icons.py ${{ steps.pick.outputs.list }} || echo "illustrations skipped"
          for n in ${{ steps.pick.outputs.list }}; do
            python src/make_episode.py "$n"
          done

      - name: Save videos for download
        if: (steps.pick.outputs.action == 'make' || steps.pick.outputs.action == 'upload') && steps.pick.outputs.list != ''
        uses: actions/upload-artifact@v4
        with:
          name: episodes-${{ github.run_number }}
          path: |
            output/*/*.mp4
            output/*/*.jpg
            output/*/*.srt
            output/*/*.txt
          retention-days: 30

      - name: Upload to YouTube
        if: steps.pick.outputs.action == 'upload' && steps.pick.outputs.list != ''
        env:
          PUBLISH_AT: ${{ steps.pick.outputs.publish_at }}
          VISIBILITY: ${{ steps.pick.outputs.visibility }}
          EVENT: ${{ github.event_name }}
        run: |
          first=1
          for n in ${{ steps.pick.outputs.list }}; do
            # Manual runs with several episodes: each scheduled episode takes the next free slot.
            if [ "$EVENT" != "schedule" ] && [ "$VISIBILITY" = "schedule" ] && [ "$first" = 0 ]; then
              PUBLISH_AT=$(python src/slot.py --force)
            fi
            first=0
            export PUBLISH_AT
            vid=$(python src/upload.py "$n" | tail -n 1)
            echo "EP $n -> https://youtu.be/$vid (publish: ${PUBLISH_AT:-private})" | tee -a "$GITHUB_STEP_SUMMARY"
            python src/mark_published.py "$n" "$vid" "$PUBLISH_AT"
          done

      # ---------- Shorts ----------

      - name: Choose Short
        id: short
        if: >-
          !cancelled() &&
          ((github.event_name == 'schedule' && vars.AUTO_SHORTS != 'false') ||
           (github.event_name == 'workflow_dispatch' && (inputs.action == 'short' || inputs.action == 'short_make')))
        env:
          EVENT: ${{ github.event_name }}
          EPISODE: ${{ inputs.episode }}
          ACTION: ${{ inputs.action }}
          VISIBILITY: ${{ inputs.visibility }}
          SHORT_SLOTS_JST: ${{ vars.SHORT_SLOTS_JST }}
        run: |
          python src/upload.py short-comments || echo "link comments skipped"
          if [ "$EVENT" = "schedule" ]; then
            when=$(python src/shorts.py slot)
            echo "Short slot: $when" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$when" = "wait" ]; then list=""; else list=$(python src/shorts.py pick next "$when"); fi
            [ -z "$list" ] && [ "$when" != "wait" ] && echo "No episode is public yet for the next Short" | tee -a "$GITHUB_STEP_SUMMARY"
            action=short
          else
            when=""
            if [ "$ACTION" = "short" ]; then
              case "$VISIBILITY" in
                schedule) when=$(python src/shorts.py slot --force) ;;
                public) when=now ;;
              esac
            fi
            list=$(python src/shorts.py pick "$EPISODE" "${when:-now}")
            action=$ACTION
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "publish_at=$when" >> "$GITHUB_OUTPUT"

      - name: Make Shorts
        if: "!cancelled() && steps.short.outputs.list != ''"
        env:
          SENA_VOICE: ${{ vars.SENA_VOICE }}
          DANIEL_VOICE: ${{ vars.DANIEL_VOICE }}
        run: |
          for n in ${{ steps.short.outputs.list }}; do
            python src/make_short.py "$n"
          done

      - name: Save Shorts for download
        if: "!cancelled() && steps.short.outputs.list != ''"
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_number }}
          path: output/*/*_short.mp4
          retention-days: 30

      - name: Upload Shorts to YouTube
        if: "!cancelled() && steps.short.outputs.list != '' && steps.short.outputs.action == 'short'"
        env:
          PUBLISH_AT: ${{ steps.short.outputs.publish_at }}
          EVENT: ${{ github.event_name }}
          VISIBILITY: ${{ inputs.visibility }}
          SHORT_SLOTS_JST: ${{ vars.SHORT_SLOTS_JST }}
        run: |
          first=1
          for n in ${{ steps.short.outputs.list }}; do
            if [ "$EVENT" != "schedule" ] && [ "$VISIBILITY" = "schedule" ] && [ "$first" = 0 ]; then
              PUBLISH_AT=$(python src/shorts.py slot --force)
            fi
            first=0
            export PUBLISH_AT
            vid=$(python src/upload.py short "$n" | tail -n 1)
            echo "Short for EP $n -> https://youtube.com/shorts/$vid (publish: ${PUBLISH_AT:-private})" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Save published.json
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add published.json
          [ -f playlist.json ] && git add playlist.json
          [ -f run_status.json ] && git add run_status.json
          [ -f shorts.json ] && git add shorts.json
          git diff --cached --quiet && exit 0
          git commit -m "Record published episodes"
          for i in 1 2 3; do
            git pull --rebase origin episodes && git push origin HEAD:episodes && exit 0
            sleep 5
          done
          echo "::error::Could not save published.json"
